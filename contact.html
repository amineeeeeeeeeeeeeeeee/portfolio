<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Amine Azarkan Portfolio - Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/map.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>

<body>

<header class="navbar-custom p-3 bg-dark">
    <div class="container d-flex justify-content-between align-items-center">
        <a href="index.html">
            <img src="./assets/amine.png" alt="Logo" class="me-3" style="height: 70px;">
        </a>
        <h1 class="mb-0 text-white">Amine Azarkan</h1>
        <nav class="ms-auto">
            <a href="index.html" class="text-white me-3">Home</a>
            <a href="portfolio.html" class="text-white me-3">Portfolio</a>
            <a href="contact.html" class="text-white active">Contact</a>
        </nav>
    </div>
</header>

<div class="container mt-5">
    <div class="row">
        <main class="col-lg-8">
            <h2>Contact</h2>
            
            <!-- Success/Error meldingen -->
            <div id="form-status" style="display: none;" class="alert"></div>
            
            <!-- Netlify form -->
            <form id="contact-form" name="contact" method="POST" data-netlify="true" data-netlify-recaptcha="true">
                <input type="hidden" name="form-name" value="contact">
                
                <div class="mb-3">
                    <label class="form-label" for="name">Naam *</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="email">Email *</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="subject">Onderwerp</label>
                    <input type="text" class="form-control" id="subject" name="subject">
                </div>

                <div class="mb-3">
                    <label class="form-label" for="message">Bericht *</label>
                    <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
                </div>

                <div class="mb-3" data-netlify-recaptcha="true"></div>

                <button type="submit" class="btn btn-primary">Verzenden</button>
            </form>
        </main>

        <aside>
            <h3 class="text-white">Contact</h3>
            <div id="apMap" style="height: 250px; width: 100%; border-radius: 10px; margin-bottom: 15px;"></div>
            <p class="text-white">
                Amine Azarkan<br>
                <a href="mailto:amine.azarkan@gmail.com">amine.azarkan@gmail.com</a>
            </p>
        </aside>
    </div>
</div>

<footer class="bg-dark text-white text-center p-3 mt-5">
    <p>© <span id="year"></span> Amine Azarkan</p>
</footer>

<script src="./js/map-ap.js"></script>
<script src="./js/script.js"></script>
<script src="/js/contact.js"></script>
</body>
</html>
